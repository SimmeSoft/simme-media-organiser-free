            <path d="M-15 38V-43L55-32V49M-15-22L55-11" fill="none" stroke="#fff4ff" stroke-width="14" stroke-linejoin="round" />
            <ellipse cx="-31" cy="40" rx="25" ry="18" fill="#fff4ff" transform="rotate(-25 -31 40)" />
            <ellipse cx="39" cy="51" rx="25" ry="18" fill="#fff4ff" transform="rotate(-25 39 51)" />
          </g>
          <path d="M282 734L901 848Q936 854 923 891L864 1090Q856 1116 824 1110L320 1015Q299 1011 292 986L245 778Q237 739 282 734Z" fill="url(#media-folder)" stroke="#24d7ff" stroke-width="12" />
          <path d="M277 744L894 858Q914 862 910 886" fill="none" stroke="#b3f6ff" stroke-width="7" opacity=".6" />
