        <g class="ear-l">
          <path d="M445 309C370 310 306 297 271 246 231 190 266 155 330 119 375 94 406 80 434 109 480 151 489 219 445 309Z" fill="#00c2e5" />
          <path d="M432 287C377 286 342 271 325 244 307 215 339 191 371 172 416 146 432 178 441 204 453 233 444 262 432 287Z" fill="url(#screen-limbs)" />
        </g>
        <g class="ear-r">
          <path d="M772 316C732 265 709 219 722 164 730 121 751 88 792 95 849 104 909 135 930 166 970 228 886 295 772 316Z" fill="#00c2e5" />
          <path d="M783 294C759 262 745 228 754 197 761 168 777 159 802 166 837 174 864 189 874 206 896 246 841 280 783 294Z" fill="url(#screen-limbs)" />
        </g>
        <g class="antenna">
