<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="492" height="516" viewBox="35 25 410 430" role="img" aria-labelledby="simme-title simme-desc">
  <title id="simme-title">Simme is organising your media</title>
  <desc id="simme-desc">Blue Simme shuffles and taps his feet while juggling a photo, a video tile and a music tile above a luminous media folder. His eyes follow the flying items and a hinged clapperboard repeatedly opens and snaps shut. Transparent decorative loading animation.</desc>
  <defs>
    <linearGradient id="simme-body" x1="0" y1=".45" x2="1" y2=".65">
      <stop stop-color="#0071cc" />
      <stop offset=".55" stop-color="#00a8e2" />
      <stop offset="1" stop-color="#00c9e9" />
    </linearGradient>
    <clipPath id="simme-eye-left">
      <circle cx="460" cy="459" r="79" />
    </clipPath>
    <clipPath id="simme-eye-right">
      <circle cx="765" cy="459" r="79" />
    </clipPath>
    <radialGradient id="screen-body" cx=".75" cy=".22" r=".95">
      <stop stop-color="#00d9ed" />
      <stop offset=".52" stop-color="#009ef0" />
      <stop offset="1" stop-color="#003cff" />
    </radialGradient>
    <linearGradient id="screen-limbs" x1=".3" y1="0" x2=".6" y2="1">
      <stop stop-color="#00dcf3" />
      <stop offset=".5" stop-color="#00a6ed" />
      <stop offset="1" stop-color="#004af9" />
    </linearGradient>
    <linearGradient id="media-folder" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#00dcf3" />
      <stop offset=".4" stop-color="#005fff" />
      <stop offset=".73" stop-color="#7b35ff" />
      <stop offset="1" stop-color="#ed1df5" />
    </linearGradient>
    <linearGradient id="media-music" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fc55de" />
      <stop offset="1" stop-color="#d50dcc" />
    </linearGradient>
    <linearGradient id="media-photo" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00bfff" />
      <stop offset="1" stop-color="#0060ff" />
    </linearGradient>
    <linearGradient id="media-video" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#04baff" />
      <stop offset="1" stop-color="#5e24ff" />
    </linearGradient>
    <clipPath id="media-photo-clip">
      <rect x="-103" y="-82" width="206" height="164" rx="10" />
    </clipPath>
    <clipPath id="media-clap-clip">
      <rect x="0" y="-46" width="250" height="46" rx="13" />
    </clipPath>
  </defs>
  <style>
    /* All styles are embedded: no app CSS, fonts, scripts or network requests. */
    .shuffle{animation:shuffle 1.6s ease-in-out infinite;transform-origin:240px 380px}
    .lean{animation:lean 3.2s ease-in-out infinite;transform-origin:600px 1050px}
    .foot-l{animation:step-l 1.6s ease-in-out infinite;transform-origin:515px 1090px}
    .foot-r{animation:step-r 1.6s ease-in-out infinite;transform-origin:705px 1090px}
    .hand-l{animation:hand-l 1.6s ease-in-out infinite;transform-origin:220px 625px}
    .hand-r{animation:hand-r 1.6s ease-in-out infinite;transform-origin:975px 625px}
    .antenna{animation:antenna 1.6s ease-in-out infinite;transform-origin:593px 270px}
    .ear-l{animation:ear-l 1.6s ease-in-out infinite;transform-origin:437px 300px}
    .ear-r{animation:ear-r 1.6s ease-in-out infinite;transform-origin:776px 305px}
    .gaze{animation:gaze 9.6s ease-in-out infinite}
    .eyes{animation:blink 9.6s linear infinite;transform-origin:600px 458px}
    .beacon{animation:beacon 3.2s ease-in-out infinite}
    .signal{animation:signal 3.2s ease-out infinite;transform-origin:238px 120px}
    .shadow{animation:shadow 1.6s ease-in-out infinite;transform-origin:240px 404px}
    .packet{animation:packet 9.6s ease-in-out infinite;opacity:0}
    .packet-b{animation-delay:-6.4s}.packet-c{animation-delay:-3.2s}
    .dot{animation:dot 1.6s ease-in-out infinite}.dot-b{animation-delay:.2s}.dot-c{animation-delay:.4s}
    @keyframes shuffle{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(-5px,-6px)}75%{transform:translate(5px,-6px)}}
    @keyframes lean{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes step-l{0%,50%,100%{transform:translate(0,0)}20%,30%{transform:translate(-19px,-35px) rotate(-12deg)}75%{transform:translate(7px,0)}}
    @keyframes step-r{0%,50%,100%{transform:translate(0,0)}70%,80%{transform:translate(19px,-35px) rotate(12deg)}25%{transform:translate(-7px,0)}}
    @keyframes hand-l{0%,100%{transform:rotate(4deg)}25%{transform:rotate(19deg) translate(0,-15px)}75%{transform:rotate(-9deg)}}
    @keyframes hand-r{0%,100%{transform:rotate(-4deg)}25%{transform:rotate(9deg)}75%{transform:rotate(-19deg) translate(0,-15px)}}
    @keyframes antenna{0%,50%,100%{transform:rotate(0deg)}25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
    @keyframes ear-l{0%,50%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
    @keyframes ear-r{0%,50%,100%{transform:rotate(0deg)}25%{transform:rotate(-3deg)}75%{transform:rotate(6deg)}}
    @keyframes gaze{0%,7%{transform:translate(-32px,-5px)}16%,24%{transform:translate(-9px,-27px)}30%,37%{transform:translate(-26px,7px)}45%,54%{transform:translate(8px,-20px)}63%,70%{transform:translate(11px,0)}79%,88%{transform:translate(-10px,-29px)}96%,100%{transform:translate(-32px,-5px)}}
    @keyframes blink{0%,27%,29%,60%,62%,92%,94%,100%{transform:scaleY(1)}28%,61%,93%{transform:scaleY(.08)}}
    @keyframes beacon{0%,72%,100%{fill:#ff1717}80%,88%{fill:#ffcf40}}
    @keyframes signal{0%,70%{opacity:0;transform:scale(.6)}77%{opacity:.55}100%{opacity:0;transform:scale(1.6)}}
    @keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:.18}25%,75%{transform:scaleX(.88);opacity:.11}}
    @keyframes packet{0%{opacity:0;transform:translate(0,10px) scale(.9)}5%,15%{opacity:.85;transform:translate(0,0) scale(1)}25%{opacity:.85}32%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}33%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}}
    @keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.8;transform:translateY(-3px)}}
    @media(prefers-reduced-motion:reduce){.shuffle,.lean,.foot-l,.foot-r,.hand-l,.hand-r,.antenna,.ear-l,.ear-r,.gaze,.eyes,.beacon,.signal,.shadow,.packet,.dot{animation:none!important}.packet,.signal{display:none}.gaze{transform:translate(-14px,0)}}
  

.photo-toss{animation:photo-toss 4.8s linear infinite}
.video-toss{animation:video-toss 4.8s linear infinite}
.music-toss{animation:music-toss 4.8s linear infinite}
.clapper-bob{animation:clapper-bob 2.4s ease-in-out infinite;transform-origin:940px 640px}
.clapper-jaw{animation:clapper-jaw 2.4s ease-in-out infinite;transform-origin:0px 0px}
.clap-spark{animation:clap-spark 2.4s linear infinite}
.catch-l{animation:catch-l 1.6s ease-in-out infinite;transform-origin:235px 840px}
.catch-r{animation:catch-r 1.6s ease-in-out infinite;transform-origin:990px 840px}
.play-light{animation:play-light 2.4s ease-in-out infinite;transform-origin:605px 930px}
.gaze{animation:media-gaze 4.8s ease-in-out infinite}
@keyframes photo-toss{0%,100%{transform:translate(330px,650px) rotate(-13deg)}10%{transform:translate(370px,466px) rotate(-5deg)}20%{transform:translate(490px,310px) rotate(5deg)}30%{transform:translate(655px,290px) rotate(12deg)}40%{transform:translate(810px,405px) rotate(18deg)}50%{transform:translate(865px,650px) rotate(12deg)}62%{transform:translate(780px,690px) rotate(4deg)}75%{transform:translate(600px,698px) rotate(-5deg)}87%{transform:translate(420px,685px) rotate(-12deg)}}
@keyframes video-toss{0%,100%{transform:translate(595px,667px) rotate(9deg)}16%{transform:translate(390px,674px) rotate(-12deg)}25%{transform:translate(335px,635px) rotate(-14deg)}35%{transform:translate(407px,418px) rotate(-7deg)}45%{transform:translate(557px,285px) rotate(3deg)}55%{transform:translate(722px,320px) rotate(12deg)}65%{transform:translate(845px,487px) rotate(17deg)}75%{transform:translate(865px,652px) rotate(13deg)}87%{transform:translate(750px,696px) rotate(5deg)}}
@keyframes music-toss{0%,100%{transform:translate(860px,660px) rotate(16deg)}12%{transform:translate(740px,693px) rotate(6deg)}25%{transform:translate(580px,698px) rotate(-5deg)}37%{transform:translate(415px,685px) rotate(-13deg)}50%{transform:translate(330px,650px) rotate(-16deg)}60%{transform:translate(395px,435px) rotate(-8deg)}70%{transform:translate(540px,292px) rotate(1deg)}80%{transform:translate(710px,305px) rotate(9deg)}90%{transform:translate(838px,453px) rotate(17deg)}}
@keyframes clapper-bob{0%,100%{transform:translate(0,0) rotate(4deg)}50%{transform:translate(0,-22px) rotate(-3deg)}}
@keyframes clapper-jaw{0%,10%,100%{transform:rotate(0)}35%,65%{transform:rotate(-27deg)}74%,80%{transform:rotate(0)}84%{transform:rotate(-5deg)}90%{transform:rotate(0)}}
@keyframes clap-spark{0%,72%,84%,100%{opacity:0}75%,79%{opacity:1}}
@keyframes catch-l{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-8px,-55px) rotate(-10deg)}50%{transform:translate(0,0)}75%{transform:translate(0,-12px)}}
@keyframes catch-r{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(0,-12px)}50%{transform:translate(0,0)}75%{transform:translate(8px,-55px) rotate(10deg)}}
@keyframes play-light{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes media-gaze{0%,100%{transform:translate(-30px,6px)}20%{transform:translate(-16px,-25px)}40%{transform:translate(8px,-10px)}50%{transform:translate(7px,7px)}70%{transform:translate(-18px,-26px)}90%{transform:translate(7px,-10px)}}
@media(prefers-reduced-motion:reduce){.photo-toss,.video-toss,.music-toss,.clapper-bob,.clapper-jaw,.clap-spark,.catch-l,.catch-r,.play-light{animation:none!important}.clap-spark{display:none}.gaze{animation:none!important;transform:translate(-12px,5px)}}
</style>
  <ellipse class="shadow" cx="240" cy="404" rx="79" ry="9" fill="#008bc4" opacity=".18" />
  <g class="shuffle">
    <g transform="translate(90 94) scale(.25)">
      <g class="lean">
