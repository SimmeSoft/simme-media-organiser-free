      </g>
    </g>
  </g>
  <g fill="#009bdd">
    <circle class="dot" cx="228" cy="430" r="3" />
    <circle class="dot dot-b" cx="240" cy="430" r="3" />
    <circle class="dot dot-c" cx="252" cy="430" r="3" />
  </g>
</svg>