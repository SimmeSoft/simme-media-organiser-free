            <rect x="-78" y="-75" width="156" height="150" rx="12" fill="url(#media-video)" />
            <g fill="#e8dbff">
              <rect x="-110" y="-72" width="19" height="23" rx="4" />
              <rect x="-110" y="-28" width="19" height="23" rx="4" />
              <rect x="-110" y="16" width="19" height="23" rx="4" />
              <rect x="-110" y="60" width="19" height="23" rx="4" />
              <rect x="91" y="-72" width="19" height="23" rx="4" />
              <rect x="91" y="-28" width="19" height="23" rx="4" />
              <rect x="91" y="16" width="19" height="23" rx="4" />
              <rect x="91" y="60" width="19" height="23" rx="4" />
            </g>
            <path d="M-24-37Q-24-44-16-40L40-7Q49 0 40 7L-16 40Q-24 44-24 36Z" fill="#ead3ff" />
          </g>
