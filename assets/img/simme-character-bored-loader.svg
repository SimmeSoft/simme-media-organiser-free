          <circle cx="593" cy="90" r="61" fill="#00c2e5" />
          <circle class="beacon" cx="593" cy="90" r="33" fill="#ff1717" />
        </g>
        <g class="eyes">
          <circle cx="460" cy="459" r="79" fill="#000" />
          <circle cx="765" cy="459" r="79" fill="#000" />
          <g clip-path="url(#simme-eye-left)">
            <g class="gaze">
              <circle cx="494" cy="459" r="33" fill="#fff" />
            </g>
          </g>
          <g clip-path="url(#simme-eye-right)">
            <g class="gaze">
              <circle cx="791" cy="459" r="33" fill="#fff" />
            </g>
          </g>
        </g>
        <g class="foot-l">
          <ellipse cx="515" cy="1091" rx="100" ry="68" fill="url(#screen-limbs)" />
        </g>
        <g class="foot-r">
          <ellipse cx="705" cy="1091" rx="100" ry="68" fill="url(#screen-limbs)" />
        </g>
        <g id="media-props">
          <path d="M285 760L308 714Q314 697 335 700L514 728 550 773 956 820Q989 827 984 859L954 1053Q950 1083 919 1075L318 984Z" fill="#006ae3" stroke="#00cdf5" stroke-width="12" />
          <g class="clapper-bob">
            <g transform="translate(807 590) rotate(-9)">
              <rect x="0" y="0" width="250" height="180" rx="17" fill="#102442" stroke="#0069ba" stroke-width="8" />
              <path d="M25 38H224M25 125H224M25 145H158" stroke="#4675a0" stroke-width="8" stroke-linecap="round" />
              <path d="M32 0l25 38h44L76 0M123 0l25 38h44L167 0M214 0l25 38h11V0" fill="#dfedff" />
              <g class="clapper-jaw">
                <rect x="0" y="-46" width="250" height="46" rx="13" fill="#11243d" stroke="#0068a9" stroke-width="6" />
                <g clip-path="url(#media-clap-clip)" fill="#e6f6ff">
                  <path d="M20 0l36-46h43L63 0M110 0l36-46h43L153 0M200 0l36-46h43L243 0" />
                </g>
                <circle cx="15" cy="-13" r="10" fill="#d3eaff" />
