<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 26 26" role="img" aria-labelledby="g02-title g02-desc"><title id="g02-title">Review and intelligence</title><desc id="g02-desc">A magnifier gently scans media while analysis lines illuminate. Gold Simme PRO glyph, transparent background.</desc><defs><linearGradient id="g02-gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0b5"/><stop offset=".32" stop-color="#ffd676"/><stop offset=".68" stop-color="#e6b34d"/><stop offset="1" stop-color="#b88628"/></linearGradient></defs><style>.g02-lens{animation:g02-scan 7s ease-in-out infinite}.g02-line{animation:g02-read 3.6s ease-in-out infinite}.g02-l2{animation-delay:.4s}.g02-l3{animation-delay:.8s}.g02-compare{animation:g02-compare 7s ease-in-out infinite}@keyframes g02-scan{0%,100%{transform:translate(0,0)}50%{transform:translate(-1.2px,-.6px)}}@keyframes g02-read{0%,100%{opacity:.45}45%,65%{opacity:1}}@keyframes g02-compare{0%,100%{transform:translateX(-.35px)}50%{transform:translateX(.35px)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}</style><g transform="translate(1 1)"><g stroke="url(#g02-gold)" stroke-width="1.25" stroke-linejoin="round" fill="#101823"><path d="M6.5 6V4.9a1 1 0 0 1 1-1H17a1 1 0 0 1 1 1V11"/><path d="M18 6h1a1 1 0 0 1 1 1v5"/><rect x="3" y="6.5" width="12.5" height="10" rx="1.5"/></g>
<path d="m4.4 14 3.3-4 3.1 3 1.5-1.6 1.8 2.6v1.1H4.4Z" fill="url(#g02-gold)"/><circle cx="12" cy="9.1" r="1.15" fill="#ffe8a7"/>
<g class="g02-compare" fill="none" stroke="url(#g02-gold)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h6.2M5.4 18.2 4 19.5l1.4 1.3M8.8 18.2l1.4 1.3-1.4 1.3"/></g>
