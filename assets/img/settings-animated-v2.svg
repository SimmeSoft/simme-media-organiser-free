<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mc-title mc-desc">
  <title id="mc-title">Media controls</title>
  <desc id="mc-desc">A glass and metal media control panel. The play symbol brightens, the slider glides, equaliser bars respond and the settings gear turns gently in a quiet twenty-second sequence. Transparent background.</desc>
  <defs>
    <linearGradient id="mc-metal" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".2" stop-color="#d6ebfb"/><stop offset=".48" stop-color="#93b9ec"/><stop offset=".72" stop-color="#c5bcff"/><stop offset="1" stop-color="#f1b9ff"/>
    </linearGradient>
    <linearGradient id="mc-rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00d9f0"/><stop offset=".48" stop-color="#3e74ff"/><stop offset="1" stop-color="#c51aff"/>
    </linearGradient>
    <linearGradient id="mc-screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#284d7c"/><stop offset=".28" stop-color="#122d55"/><stop offset="1" stop-color="#090f2c"/>
    </linearGradient>
    <linearGradient id="mc-colour" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7afff5"/><stop offset=".45" stop-color="#23c9f1"/><stop offset=".72" stop-color="#8274ff"/><stop offset="1" stop-color="#e35cf1"/>
    </linearGradient>
    <linearGradient id="mc-track" gradientUnits="userSpaceOnUse" x1="53" y1="127" x2="187" y2="127">
      <stop stop-color="#72fff7"/><stop offset=".42" stop-color="#19cfff"/><stop offset=".7" stop-color="#7164ff"/><stop offset="1" stop-color="#fa55ed"/>
    </linearGradient>
    <linearGradient id="mc-button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4f92c1"/><stop offset=".5" stop-color="#244c80"/><stop offset="1" stop-color="#17254e"/>
    </linearGradient>
    <linearGradient id="mc-button-violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b76aed"/><stop offset=".45" stop-color="#704dcc"/><stop offset="1" stop-color="#35256f"/>
    </linearGradient>
    <clipPath id="mc-window"><rect x="31" y="31" width="178" height="178" rx="29"/></clipPath>
  </defs>
  <style>
    .mc-play { transform-origin:77px 86px; animation:mc-play 20s ease-in-out infinite; }
    .mc-slider { animation:mc-slider 20s ease-in-out infinite; }
    .mc-bar-a,.mc-bar-b,.mc-bar-c { transform-box:fill-box; transform-origin:center bottom; animation:mc-bars 20s ease-in-out infinite; }
    .mc-bar-b { animation-delay:.35s; }.mc-bar-c { animation-delay:.7s; }
    .mc-gear { transform-box:fill-box; transform-origin:center; animation:mc-gear 20s ease-in-out infinite; }
    .mc-status { animation:mc-status 20s ease-in-out infinite; }
    @keyframes mc-play { 0%,4%,18%,100%{transform:scale(1);opacity:.85}8%,13%{transform:scale(1.06);opacity:1} }
    @keyframes mc-slider { 0%,22%,100%{transform:translateX(-25px)}35%,48%{transform:translateX(23px)}58%,88%{transform:translateX(0)} }
    @keyframes mc-bars { 0%,50%,72%,100%{transform:scaleY(1)}55%{transform:scaleY(.58)}60%{transform:scaleY(1.18)}65%{transform:scaleY(.76)} }
    @keyframes mc-gear { 0%,73%,100%{transform:rotate(0)}84%,91%{transform:rotate(45deg)} }
    @keyframes mc-status { 0%,18%,72%,100%{opacity:.35}28%,62%{opacity:.8} }
    @media (prefers-reduced-motion:reduce) { .mc-play,.mc-slider,.mc-bar-a,.mc-bar-b,.mc-bar-c,.mc-gear,.mc-status { animation:none!important; } }
  </style>
  <!-- Complete stationary metal frame; there is no surrounding background rectangle. -->
  <rect x="15" y="15" width="210" height="210" rx="41" fill="url(#mc-metal)" stroke="url(#mc-rim)" stroke-width="2.5"/>
  <rect x="18" y="18" width="204" height="204" rx="38" fill="none" stroke="#f8fdff" stroke-width="1.4" opacity=".9"/>
  <rect x="27" y="27" width="186" height="186" rx="33" fill="#07132d" stroke="#5685e7" stroke-width="2.2"/>
  <rect x="31" y="31" width="178" height="178" rx="29" fill="url(#mc-screen)"/>
  <g clip-path="url(#mc-window)">
    <path d="M35 35H142L32 105V48Q32 35 35 35Z" fill="#b7e4ff" opacity=".12"/>
    <path class="mc-status" d="M39 199H198" stroke="url(#mc-track)" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
  </g>
  <path d="M23 57Q24 21 58 21H190" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".92"/>
  <path d="M30 199Q34 218 58 218H188" fill="none" stroke="#f2d9ff" stroke-width="2" stroke-linecap="round" opacity=".72"/>

  <!-- Upper control area. -->
  <g class="mc-play">
    <path d="M57 58Q57 53 62 56L101 81Q107 85 101 89L62 115Q57 118 57 112Z" fill="url(#mc-colour)" stroke="#efffff" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M64 62 94 81" fill="none" stroke="#d6ffff" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
  </g>
  <path d="M124 68h55M124 91h36" fill="none" stroke="url(#mc-metal)" stroke-width="9" stroke-linecap="round"/>
  <path d="M124 67h55M124 90h36" fill="none" stroke="#f8ffff" stroke-width="2" stroke-linecap="round" opacity=".6"/>

  <!-- Slider track stays fixed; only the knob glides. -->
  <path d="M53 127H187" stroke="#17284d" stroke-width="12" stroke-linecap="round"/>
  <path d="M53 127H187" stroke="url(#mc-track)" stroke-width="8" stroke-linecap="round"/>
  <g class="mc-slider">
    <circle cx="120" cy="127" r="13" fill="url(#mc-metal)" stroke="#fff" stroke-width="1.8"/>
    <circle cx="120" cy="127" r="8" fill="url(#mc-colour)"/>
    <circle cx="117" cy="123.5" r="2.5" fill="#fff" opacity=".65"/>
  </g>

  <!-- Three compact action buttons. -->
  <g>
    <rect x="43" y="151" width="48" height="48" rx="13" fill="url(#mc-button)" stroke="url(#mc-metal)" stroke-width="3"/>
    <path d="M55 168h24M55 182h24" stroke="#edfaff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="96" y="151" width="48" height="48" rx="13" fill="url(#mc-button)" stroke="url(#mc-metal)" stroke-width="3"/>
    <rect class="mc-bar-a" x="108" y="171" width="6" height="17" rx="3" fill="url(#mc-metal)"/>
    <rect class="mc-bar-b" x="117" y="161" width="6" height="27" rx="3" fill="url(#mc-metal)"/>
    <rect class="mc-bar-c" x="126" y="166" width="6" height="22" rx="3" fill="url(#mc-metal)"/>
  </g>
  <g>
    <rect x="149" y="151" width="48" height="48" rx="13" fill="url(#mc-button-violet)" stroke="#efcaff" stroke-width="3"/>
    <g transform="translate(52 52) scale(.7)">
      <g class="mc-gear" fill="#f7efff">
        <path fill-rule="evenodd" d="M168 158h6l1.2 5a17 17 0 0 1 4 1.7l4.4-2.7 4.2 4.2-2.7 4.4a17 17 0 0 1 1.7 4l5 1.2v6l-5 1.2a17 17 0 0 1-1.7 4l2.7 4.4-4.2 4.2-4.4-2.7a17 17 0 0 1-4 1.7l-1.2 5h-6l-1.2-5a17 17 0 0 1-4-1.7l-4.4 2.7-4.2-4.2 2.7-4.4a17 17 0 0 1-1.7-4l-5-1.2v-6l5-1.2a17 17 0 0 1 1.7-4l-2.7-4.4 4.2-4.2 4.4 2.7a17 17 0 0 1 4-1.7Zm3 13a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z"/>
      </g>
    </g>
  </g>
</svg>
