<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 26 26" role="img" aria-labelledby="g03-title g03-desc"><title id="g03-title">Transfer and batch tools</title><desc id="g03-desc">A stack of media gently shifts as g03-import and g03-export arrows travel. Gold Simme PRO glyph, transparent background.</desc><defs><linearGradient id="g03-gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0b5"/><stop offset=".32" stop-color="#ffd676"/><stop offset=".68" stop-color="#e6b34d"/><stop offset="1" stop-color="#b88628"/></linearGradient></defs><style>.g03-export{animation:g03-out 5s ease-in-out infinite}.g03-import{animation:g03-in 5s ease-in-out infinite}.g03-front{animation:g03-front 5s ease-in-out infinite}.g03-middle{animation:g03-middle 5s ease-in-out infinite}@keyframes g03-out{0%,100%{transform:translateX(-.6px)}50%{transform:translateX(.6px)}}@keyframes g03-in{0%,100%{transform:translateX(.6px)}50%{transform:translateX(-.6px)}}@keyframes g03-front{0%,100%{transform:translate(0,0)}50%{transform:translate(.55px,-.45px)}}@keyframes g03-middle{0%,100%{transform:translate(0,0)}50%{transform:translate(-.3px,-.2px)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}</style><g transform="translate(1 1)"><g fill="#101823" stroke="url(#g03-gold)" stroke-width="1.3" stroke-linejoin="round"><rect class="g03-back" x="3.2" y="7.3" width="12" height="9.8" rx="1.4"/><rect class="g03-middle" x="5.1" y="8.5" width="12" height="9.8" rx="1.4"/><g class="g03-front"><rect x="7" y="9.7" width="12" height="9.8" rx="1.4"/><path d="m8.4 17.7 2.9-3.6 2.6 2.7 1.6-1.8 2.1 2.7Z" fill="url(#g03-gold)" stroke-width=".4"/><circle cx="15.6" cy="12.5" r="1" fill="#ffe8a7" stroke="none"/></g></g>
<g class="g03-export" fill="none" stroke="url(#g03-gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5.5c1.2-1.5 2.7-1.7 5-1.7h7"/><path d="m16.1 2 2.1 1.8-2.1 1.8"/></g>
<g class="g03-import" fill="none" stroke="url(#g03-gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 20.4c-1 .9-2.3 1.1-4.1 1.1H6"/><path d="m7.9 19.7-2.1 1.8 2.1 1.8"/></g></g></svg>